name: Prepare pinned Shopify taxonomy
description: Explicitly prepare ignored release data before checkout installation or packaging
inputs:
  allow-download:
    description: Explicit authorization to fetch pinned official taxonomy sources
    required: false
    default: "false"
  source-cache:
    description: Optional verified local source directory
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install declared build tooling
      shell: bash
      run: python -m pip install --disable-pip-version-check --no-input hatchling
    - name: Prepare pinned resource with shared importer
      shell: bash
      env:
        ALLOW_DOWNLOAD: ${{ inputs.allow-download }}
        SOURCE_CACHE: ${{ inputs.source-cache }}
        OPENBLAS_NUM_THREADS: "1"
        OMP_NUM_THREADS: "2"
        MKL_NUM_THREADS: "1"
        TOKENIZERS_PARALLELISM: "false"
      run: |
        args=()
        if [[ "$ALLOW_DOWNLOAD" == "true" ]]; then args+=(--allow-download); fi
        if [[ -n "$SOURCE_CACHE" ]]; then args+=(--source-cache "$SOURCE_CACHE"); fi
        python scripts/bootstrap_taxonomy.py "${args[@]}"
