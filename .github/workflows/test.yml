name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,mcp]"

      - name: Optional SDK import compatibility
        run: |
          python - <<'PYCODE'
          import sys
          sys.modules["mcp"] = None
          from shopextract.tools import ToolRuntime, ToolConfig
          runtime = ToolRuntime(ToolConfig())
          assert len(runtime.tool_schemas()) == 8
          PYCODE

      - name: Require MCP extra
        run: python -c "import mcp; import importlib.metadata; print(importlib.metadata.version('mcp'))"

      # All assertions retained: each file family <=240s, shared total <=480s.
      - name: Run complete bounded test gate
        run: python scripts/run_tests.py --output-dir "${RUNNER_TEMP}/shopextract-tests"
